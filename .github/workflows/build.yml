name: Build WeChat Theme Engine Dylib

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build arm64 dylib
        run: |
          mkdir -p build
          xcrun --sdk iphoneos clang \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -dynamiclib \
            -lc++abi \
            -framework Foundation \
                       -framework UIKit \
            -framework UniformTypeIdentifiers \
            ThemeEngine.mm \
            -o build/WeChatThemeEngine.dylib
          codesign --force --sign - build/WeChatThemeEngine.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: WeChatThemeEngine-dylib
          path: build/WeChatThemeEngine.dylib
          if-no-files-found: error


